rm_group:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  # Cartesian RCM paths require a sequence of closely spaced IK solutions.
  # Give KDL enough time to continue from the previous solution along RCM paths.
  kinematics_solver_timeout: 0.25
