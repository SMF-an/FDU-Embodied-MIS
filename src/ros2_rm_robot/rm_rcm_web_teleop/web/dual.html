<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101713">
  <title>双臂 RCM 遥控器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101713;
      --surface: #19231e;
      --surface-2: #202d26;
      --line: #33443a;
      --text: #edf5ef;
      --muted: #9baea1;
      --green: #74d69a;
      --amber: #f0b85c;
      --red: #f07777;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px 18px 28px;
      background: #101713; color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(1680px, 100%); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; }
    .subtitle { color: var(--muted); margin: 3px 0 0; font-size: 13px; }
    .system-status { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(225px, .78fr) minmax(420px, 1.5fr) minmax(225px, .78fr);
      grid-template-areas: "left camera right";
      align-items: stretch;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .arm { min-width: 0; padding: 16px 14px 18px; }
    .arm-left { grid-area: left; }
    .arm-right { grid-area: right; border-left: 1px solid var(--line); }
    .camera-panel { grid-area: camera; min-width: 0; padding: 16px; border-left: 1px solid var(--line); }
    .arm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 18px; font-weight: 620; }
    .arm-status { color: var(--muted); font-size: 12px; }
    .arm-status.ready { color: var(--green); }
    .arm-status.busy { color: var(--amber); }
    .controls { display: grid; grid-template-columns: 1fr; gap: 15px; align-items: center; padding-top: 15px; }
    .control-label { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .pad-wrap { display: grid; justify-items: center; }
    .pad {
      width: min(14vw, 185px); min-width: 132px; aspect-ratio: 1; border-radius: 50%; position: relative;
      border: 1px solid #597262; background:
        linear-gradient(90deg, transparent 49.7%, #78928133 50%, transparent 50.3%),
        linear-gradient(transparent 49.7%, #78928133 50%, transparent 50.3%),
        radial-gradient(circle, #25362c, #17221b 68%);
      box-shadow: inset 0 0 24px #0005; touch-action: none; user-select: none; cursor: crosshair;
    }
    .pad::before, .pad::after { content: ""; position: absolute; border: 1px solid #78928127; border-radius: 50%; inset: 17%; pointer-events: none; }
    .pad::after { inset: 34%; }
    .knob { width: 30%; aspect-ratio: 1; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid #d3f7df; background: #65c987; box-shadow: 0 0 18px #67cf8b55; pointer-events: none; }
    .pad-caption { margin-top: 8px; color: var(--muted); font-size: 11px; text-align: center; }
    .moves { display: grid; gap: 8px; }
    button { font: inherit; cursor: pointer; }
    .move { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid #46614f; border-radius: 6px; color: var(--text); background: #20372a; text-align: left; touch-action: none; user-select: none; }
    .move:active, .move.held { background: #326244; }
    .move small { display: block; margin-top: 2px; color: #b3d4bd; font-size: 10px; }
    .move .symbol { color: #b8f3cd; font-size: 20px; }
    .stop { min-height: 38px; border: 1px solid #744348; border-radius: 6px; background: #382326; color: #ffd8d8; }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .readout { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
    .pill { border: 1px solid #324339; border-radius: 5px; background: #141d17; color: #bfcec3; padding: 5px 8px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .message { min-height: 20px; margin: 11px 0 0; color: var(--muted); font-size: 12px; }
    .message.error { color: #ff9e9e; }
    footer { margin-top: 13px; color: var(--muted); font-size: 12px; }
    .camera-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .camera-head h2 { font-size: 16px; }
    .camera-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .camera-status { color: var(--muted); font-size: 12px; text-align: right; }
    .camera-status.online { color: var(--green); }
    .record-button { min-height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border: 1px solid #79504c; border-radius: 5px; background: #352321; color: #ffe4df; }
    .record-button:disabled { opacity: .45; cursor: not-allowed; }
    .record-dot { width: 9px; aspect-ratio: 1; border-radius: 50%; background: #f07777; }
    .record-button.recording { border-color: #d65d5d; background: #5a2929; }
    .record-button.recording .record-dot { animation: record-pulse 1.2s ease-in-out infinite; }
    @keyframes record-pulse { 50% { opacity: .35; } }
    .camera-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid #40534a;
      border-radius: 5px;
      background: #090d0b;
    }
    .camera-image { width: 100%; height: 100%; object-fit: contain; opacity: 0; }
    .camera-image.visible { opacity: 1; }
    .camera-placeholder { position: absolute; display: grid; gap: 7px; justify-items: center; color: #a7b5ab; font-size: 13px; text-align: center; padding: 16px; }
    .camera-placeholder[hidden] { display: none; }
    .camera-placeholder strong { color: #e2ece5; font-size: 15px; font-weight: 600; }
    .camera-topic { margin-top: 9px; overflow-wrap: anywhere; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-areas: "camera camera" "left right";
      }
      .camera-panel { border-left: 0; border-bottom: 1px solid var(--line); }
      .arm-right { border-left: 1px solid var(--line); }
      .controls { grid-template-columns: minmax(0, 1fr) minmax(130px, .8fr); gap: 14px; }
      .pad { width: min(20vw, 185px); }
    }
    @media (max-width: 720px) {
      body { padding: 13px 12px 22px; }
      header { align-items: flex-start; }
      h1 { font-size: 20px; }
      .workspace {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "camera" "left" "right";
      }
      .camera-panel { padding: 12px 4px 15px; }
      .arm { padding: 14px 4px 17px; }
      .arm-right { border-left: 0; border-top: 1px solid var(--line); }
      .controls { grid-template-columns: minmax(0, 1fr) minmax(140px, .8fr); gap: 14px; }
      .pad { width: min(38vw, 185px); }
    }
    @media (max-width: 380px) {
      .controls { grid-template-columns: 1fr; }
      .moves { grid-template-columns: 1fr 1fr; }
      .stop { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>双臂 RCM 遥控器</h1>
        <p id="mode" class="subtitle">连接遥控服务中</p>
      </div>
      <div id="systemStatus" class="system-status">双臂状态待同步</div>
    </header>
    <div class="workspace">
      <section class="arm arm-left" data-arm="left">
        <div class="arm-head"><h2>左臂</h2><span class="arm-status" id="leftStatus">等待状态</span></div>
        <div class="controls">
          <div>
            <div class="control-label">器具旋转</div>
            <div class="pad-wrap"><div class="pad" id="leftPad" aria-label="左臂旋转摇杆"><div class="knob" id="leftKnob"></div></div><span class="pad-caption">推动摇杆控制器具倾转</span></div>
          </div>
          <div>
            <div class="control-label">轴向插入 / 退出</div>
            <div class="moves">
              <button class="move" id="leftAdvance" type="button"><span>向前插入<small>沿器具轴线</small></span><span class="symbol">＋</span></button>
              <button class="move" id="leftRetract" type="button"><span>向后退出<small>沿器具轴线</small></span><span class="symbol">－</span></button>
              <button class="stop" id="leftStop" type="button">停止左臂</button>
            </div>
          </div>
        </div>
        <div class="readout"><span class="pill" id="leftPosition">尖端：等待状态</span><span class="pill" id="leftDepth">距 RCM：--</span><span class="pill" id="leftStep">步长：--</span></div>
        <p class="message" id="leftMessage" role="status">等待左臂 RCM 状态。</p>
      </section>
      <section class="camera-panel" aria-label="实时相机画面">
        <div class="camera-head">
          <h2>实时相机</h2>
          <div class="camera-actions">
            <span id="cameraStatus" class="camera-status">等待 RGB 图像</span>
            <button id="recordButton" class="record-button" type="button" disabled aria-pressed="false" title="录制当前 RGB 画面并保存为 WebM">
              <span class="record-dot" aria-hidden="true"></span><span id="recordButtonLabel">录制</span>
            </button>
          </div>
        </div>
        <div class="camera-stage">
          <img id="cameraImage" class="camera-image" src="/camera.mjpg" alt="RealSense 实时 RGB 画面">
          <div id="cameraPlaceholder" class="camera-placeholder">
            <strong>等待相机画面</strong>
            <span>确认 RealSense 节点正在发布 RGB 图像</span>
          </div>
        </div>
        <div id="cameraTopic" class="camera-topic">/camera/camera/color/image_raw</div>
      </section>
      <section class="arm arm-right" data-arm="right">
        <div class="arm-head"><h2>右臂</h2><span class="arm-status" id="rightStatus">等待状态</span></div>
        <div class="controls">
          <div>
            <div class="control-label">器具旋转</div>
            <div class="pad-wrap"><div class="pad" id="rightPad" aria-label="右臂旋转摇杆"><div class="knob" id="rightKnob"></div></div><span class="pad-caption">推动摇杆控制器具倾转</span></div>
          </div>
          <div>
            <div class="control-label">轴向插入 / 退出</div>
            <div class="moves">
              <button class="move" id="rightAdvance" type="button"><span>向前插入<small>沿器具轴线</small></span><span class="symbol">＋</span></button>
              <button class="move" id="rightRetract" type="button"><span>向后退出<small>沿器具轴线</small></span><span class="symbol">－</span></button>
              <button class="stop" id="rightStop" type="button">停止右臂</button>
            </div>
          </div>
        </div>
        <div class="readout"><span class="pill" id="rightPosition">尖端：等待状态</span><span class="pill" id="rightDepth">距 RCM：--</span><span class="pill" id="rightStep">步长：--</span></div>
        <p class="message" id="rightMessage" role="status">等待右臂 RCM 状态。</p>
      </section>
    </div>
    <footer>一次只执行一侧的步进命令；停止按钮发送软件停止请求，不替代控制柜急停。</footer>
  </main>
  <script>
    const sides = ['left', 'right'];
    const controllers = {};
    let state = null;
    let sideStates = {};
    const cameraImage = document.getElementById('cameraImage');
    const recordButton = document.getElementById('recordButton');
    const recordButtonLabel = document.getElementById('recordButtonLabel');
    let mediaRecorder = null;
    let recordingChunks = [];
    let recordingCanvas = null;
    let recordingContext = null;
    let recordingStream = null;
    let recordingFrame = null;

    function setRecordButton(recording, label = recording ? '停止并保存' : '录制') {
      recordButton.classList.toggle('recording', recording);
      recordButton.setAttribute('aria-pressed', String(recording));
      recordButtonLabel.textContent = label;
    }

    function saveRecording() {
      const blob = new Blob(recordingChunks, { type: mediaRecorder?.mimeType || 'video/webm' });
      recordingChunks = [];
      if (blob.size) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        link.href = url;
        link.download = `rgb-recording-${timestamp}.webm`;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      recordingStream?.getTracks().forEach(track => track.stop());
      recordingStream = null;
      mediaRecorder = null;
      setRecordButton(false);
      recordButton.disabled = !state?.camera?.available || !recordingSupported();
      document.getElementById('cameraStatus').textContent = blob.size ? '视频已保存' : '没有录到视频帧';
    }

    function recordingSupported() {
      return Boolean(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);
    }

    function toggleRecording() {
      if (mediaRecorder?.state === 'recording') {
        setRecordButton(false, '正在保存…');
        recordButton.disabled = true;
        mediaRecorder.stop();
        return;
      }
      if (!state?.camera?.available || !cameraImage.complete || !cameraImage.naturalWidth) return;
      if (!recordingSupported()) {
        document.getElementById('cameraStatus').textContent = '当前浏览器不支持录制';
        return;
      }

      recordingCanvas = document.createElement('canvas');
      recordingCanvas.width = cameraImage.naturalWidth;
      recordingCanvas.height = cameraImage.naturalHeight;
      recordingContext = recordingCanvas.getContext('2d');
      recordingContext.drawImage(cameraImage, 0, 0, recordingCanvas.width, recordingCanvas.height);
      recordingStream = recordingCanvas.captureStream(15);
      const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
        .find(type => MediaRecorder.isTypeSupported(type));
      try {
        mediaRecorder = new MediaRecorder(recordingStream, mimeType ? { mimeType } : {});
      } catch (error) {
        recordingStream.getTracks().forEach(track => track.stop());
        recordingStream = null;
        document.getElementById('cameraStatus').textContent = `无法启动录制：${error.message}`;
        return;
      }
      recordingChunks = [];
      mediaRecorder.addEventListener('dataavailable', event => {
        if (event.data.size) recordingChunks.push(event.data);
      });
      mediaRecorder.addEventListener('stop', saveRecording, { once: true });
      mediaRecorder.addEventListener('error', () => {
        document.getElementById('cameraStatus').textContent = '录制失败';
      }, { once: true });
      mediaRecorder.start(1000);
      setRecordButton(true);
      recordButton.disabled = false;
      recordingFrame = window.setInterval(() => {
        if (mediaRecorder?.state === 'recording' && cameraImage.complete) {
          recordingContext.drawImage(cameraImage, 0, 0, recordingCanvas.width, recordingCanvas.height);
        }
      }, 1000 / 15);
      mediaRecorder.addEventListener('stop', () => {
        window.clearInterval(recordingFrame);
        recordingFrame = null;
      }, { once: true });
      document.getElementById('cameraStatus').textContent = '正在录制 RGB';
    }

    recordButton.addEventListener('click', toggleRecording);

    cameraImage.addEventListener('error', () => {
      window.setTimeout(() => {
        cameraImage.src = `/camera.mjpg#${Date.now()}`;
      }, 1200);
    });

    function showMessage(side, text, isError = false) {
      const el = document.getElementById(`${side}Message`);
      el.textContent = text;
      el.classList.toggle('error', isError);
    }

    function resetPad(side) {
      const controller = controllers[side];
      controller.joystick = { x: 0, y: 0, active: false };
      controller.knob.style.left = '50%';
      controller.knob.style.top = '50%';
    }

    function setupSide(side) {
      const cap = side[0].toUpperCase() + side.slice(1);
      const controller = controllers[side] = {
        pad: document.getElementById(`${side}Pad`),
        knob: document.getElementById(`${side}Knob`),
        joystick: { x: 0, y: 0, active: false },
        insertion: 0,
        waiting: false,
        sawBusy: false,
        sentAt: 0,
        sending: false
      };
      const pad = controller.pad;
      function updatePad(event) {
        const rect = pad.getBoundingClientRect();
        const max = rect.width * 0.31;
        const dx = event.clientX - (rect.left + rect.width / 2);
        const dy = event.clientY - (rect.top + rect.height / 2);
        const length = Math.hypot(dx, dy);
        const scale = length > max ? max / length : 1;
        const x = dx * scale;
        const y = dy * scale;
        controller.knob.style.left = `calc(50% + ${x}px)`;
        controller.knob.style.top = `calc(50% + ${y}px)`;
        controller.joystick.x = Math.max(-1, Math.min(1, x / max));
        controller.joystick.y = Math.max(-1, Math.min(1, -y / max));
        controller.joystick.active = Math.hypot(controller.joystick.x, controller.joystick.y) > 0.16;
      }
      pad.addEventListener('pointerdown', event => { pad.setPointerCapture(event.pointerId); updatePad(event); });
      pad.addEventListener('pointermove', event => { if (pad.hasPointerCapture(event.pointerId)) updatePad(event); });
      pad.addEventListener('pointerup', () => resetPad(side));
      pad.addEventListener('pointercancel', () => resetPad(side));

      for (const [id, value] of [[`${side}Advance`, 1], [`${side}Retract`, -1]]) {
        const button = document.getElementById(id);
        const release = () => { controller.insertion = 0; button.classList.remove('held'); };
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          controller.insertion = value;
          button.classList.add('held');
        });
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      }
      document.getElementById(`${side}Stop`).addEventListener('click', () => stop(side));
    }

    async function post(path, body) {
      const response = await fetch(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      return result;
    }

    async function pump(side) {
      const controller = controllers[side];
      const arm = sideStates[side];
      if (controller.sending || !arm?.ready || arm.busy || state?.locked_by || controller.waiting) return;
      if (!controller.joystick.active && controller.insertion === 0) return;
      controller.sending = true;
      try {
        await post('/api/jog', {
          arm: side,
          tilt_x: controller.joystick.active ? controller.joystick.x : 0,
          tilt_y: controller.joystick.active ? controller.joystick.y : 0,
          insertion: controller.insertion
        });
        controller.waiting = true;
        controller.sawBusy = false;
        controller.sentAt = Date.now();
        showMessage(side, '已发送一步，等待机械臂完成…');
      } catch (error) {
        if (error.message.includes('moving')) controller.waiting = true;
        showMessage(side, error.message, true);
      } finally {
        controller.sending = false;
      }
    }

    async function stop(side) {
      resetPad(side);
      controllers[side].insertion = 0;
      try {
        await post('/api/stop', { arm: side });
        controllers[side].waiting = true;
        controllers[side].sawBusy = Boolean(sideStates[side]?.busy);
        controllers[side].sentAt = Date.now();
        showMessage(side, '已请求停止该臂当前轨迹。');
      } catch (error) {
        showMessage(side, error.message, true);
      }
    }

    async function poll() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        state = await response.json();
        sideStates = state.arms;
        const camera = state.camera;
        const cameraStatus = document.getElementById('cameraStatus');
        cameraStatus.textContent = camera.available
          ? `${camera.width} × ${camera.height} · 在线`
          : '等待 RGB 图像';
        cameraStatus.classList.toggle('online', camera.available);
        document.getElementById('cameraImage').classList.toggle('visible', camera.available);
        document.getElementById('cameraPlaceholder').hidden = camera.available;
        document.getElementById('cameraTopic').textContent = camera.topic;
        recordButton.disabled = !camera.available || !recordingSupported() ||
          recordButtonLabel.textContent === '正在保存…';
        const modeName = state.mode === 'real' ? '真机' : '仿真';
        document.getElementById('mode').textContent = `RM65-6FB ${modeName}双臂控制`;
        const systemStatus = document.getElementById('systemStatus');
        systemStatus.textContent = state.locked_by ? `${state.locked_by === 'left' ? '左' : '右'}臂执行中` : '双臂待命';
        for (const side of sides) {
          const arm = sideStates[side];
          const cap = side[0].toUpperCase() + side.slice(1);
          const status = document.getElementById(`${side}Status`);
          status.classList.toggle('ready', arm.ready && !arm.busy);
          status.classList.toggle('busy', arm.busy);
          status.textContent = !arm.ready ? '等待状态' : arm.busy ? '运动中' : `${modeName}已连接`;
          document.getElementById(`${side}Position`).textContent = arm.ready
            ? `尖端：${(arm.tip.x * 1000).toFixed(1)}, ${(arm.tip.y * 1000).toFixed(1)}, ${(arm.tip.z * 1000).toFixed(1)} mm`
            : '尖端：等待状态';
          document.getElementById(`${side}Depth`).textContent = arm.ready
            ? `距 RCM：${(arm.tip_to_rcm_m * 1000).toFixed(1)} mm` : '距 RCM：--';
          document.getElementById(`${side}Step`).textContent = `步长：${state.step_angle_deg}° / ${state.step_insertion_mm} mm`;
          const lockedOther = state.locked_by && state.locked_by !== side;
          document.getElementById(`${side}Advance`).disabled = !arm.ready || lockedOther;
          document.getElementById(`${side}Retract`).disabled = !arm.ready || lockedOther;
          document.getElementById(`${side}Pad`).style.pointerEvents = (!arm.ready || lockedOther) ? 'none' : 'auto';
          document.getElementById(`${side}Stop`).disabled = !arm.busy || lockedOther;
          const controller = controllers[side];
          if (arm.busy) controller.sawBusy = true;
          if (controller.waiting && controller.sawBusy && !arm.busy) {
            controller.waiting = false;
            showMessage(side, '运动完成；可继续操作。');
          } else if (controller.waiting && !controller.sawBusy && Date.now() - controller.sentAt > 3000 && !arm.busy) {
            controller.waiting = false;
          }
          if (!arm.ready) showMessage(side, arm.message || `等待${cap}臂 RCM 状态。`);
        }
      } catch (_error) {
        document.getElementById('mode').textContent = '遥控服务未连接';
        document.getElementById('systemStatus').textContent = '服务未连接';
        document.getElementById('cameraStatus').textContent = '服务未连接';
        document.getElementById('cameraStatus').classList.remove('online');
        document.getElementById('cameraImage').classList.remove('visible');
        document.getElementById('cameraPlaceholder').hidden = false;
        for (const side of sides) {
          document.getElementById(`${side}Status`).textContent = '服务未连接';
          showMessage(side, '无法连接遥控服务，请确认 ROS 节点正在运行。', true);
        }
      }
      for (const side of sides) pump(side);
    }

    sides.forEach(setupSide);
    setInterval(poll, 200);
    poll();
  </script>
</body>
</html>
